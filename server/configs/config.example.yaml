# 职途 后端配置文件
# 修改后需重启服务生效

server:
  # 服务监听端口
  port: 8080
  # gin 模式：debug / release / test
  mode: debug
  # 跨域允许的来源，留空表示允许全部
  allow_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

database:
  # 数据库文件路径（相对于 server 目录）
  path: ./data/zhitu.db
  # 日志级别：silent / error / warn / info
  log_level: warn

jwt:
  # JWT 签名密钥，生产环境务必修改为强随机字符串
  secret: "please-change-this-to-a-strong-random-secret"
  # 管理员 Token 使用独立签名密钥
  admin_secret: "please-change-this-admin-secret"
  # JWT 签发者
  issuer: "zhitu"
  # Token 有效期（小时），7 天 = 168
  expire_hours: 168

# 管理员凭据 —— 直接写在此处，不在数据库中维护
# 可从首页统一登录入口进入产品工作台，也可从 /admin/login 进入管理后台
admin:
  email: "admin@zhitu.com"
  password: "admin123456"

# LLM 接口配置
# provider 可选：openai / anthropic / mimo
#
# MiMo 部署示例（面试功能推荐配置）：
#   provider: anthropic
#   base_url: "https://api.xiaomimimo.com/anthropic/v1/messages"
#   chat_model:      "mimo-v2.5-pro"   # 文字分析（提问、评分、报告）
#   whisper_model:   "mimo-v2.5-asr"   # 语音识别（用户回答转文字）
#   tts_model:        "mimo-v2.5-tts"   # 语音生成（AI 面试官朗读，用户可选）
#   tts_voice:        "Chloe"           # 预置音色：冰糖/茉莉/苏打/白桦/Mia/Chloe/Milo/Dean
#
# 注意：mimo 的 ASR/TTS 不走 OpenAI 的 /audio/* 端点，
# 代码内部统一通过 /v1/chat/completions 调用，无需额外配置。
llm:
  provider: openai
  base_url: "https://api.openai.com/v1"
  # 密钥只配置在服务器，前端不得保存或传递供应商密钥。
  api_key: ""
  chat_model: "gpt-4o"
  whisper_model: "whisper-1"
  tts_model: "tts-1"
  tts_voice: "alloy"
  temperature: 0.7
  max_tokens: 4096
  timeout_sec: 60

# 文件存储（本地磁盘），生产环境可替换为对象存储
storage:
  base_dir: "./data/uploads"
  audio_dir: "./data/uploads/audio"
  tts_dir: "./data/uploads/tts"
  resume_dir: "./data/uploads/resume"
  max_upload_mb: 20
